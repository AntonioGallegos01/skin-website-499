<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>

    <style>
        body {
            background-color: #e7eabf;
            font-family: Arial, sans-serif;
            text-align: center;
        }

         .container {
            width: 400px;
            margin: 80px auto;
            padding: 25px;
            background-color: #d0d9a0;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        .btn {
            display: block;
            width: 200px;
            margin: 10px auto;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Welcome</h1>

    <a href="{{ url_for('add_user') }}" class="btn">Sign Up</a>
    <a href="{{url_for('login') }}" class="btn">Login</a>
    <a href="{{ url_for('list_users') }}" class="btn">Current Users</a>
    
    
</div>

</body>
</html>
